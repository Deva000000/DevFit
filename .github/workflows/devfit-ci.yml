name: DevFit reliability

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check server functions
        run: |
          npm ci --ignore-scripts --no-fund
          node scripts/check-release.mjs
          for file in api/*.js; do node --check "$file"; done
      - name: Reliability regression suite
        run: node --test tests/*.test.mjs

  sql-regressions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: devfit_scale_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: synthetic-local-only
    steps:
      - uses: actions/checkout@v4
      - name: Fresh schema and rollback-only database regressions
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d devfit_scale_ci -v ON_ERROR_STOP=1 -f tests/scaling/bootstrap.sql
          for file in supabase/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d devfit_scale_ci -v ON_ERROR_STOP=1 -f "$file"
          done
          for file in incremental-regression program-integrity food-cache-regression session-regression login-recovery-regression notification-regression notification-scheduler-regression; do
            psql -h 127.0.0.1 -U postgres -d devfit_scale_ci -v ON_ERROR_STOP=1 -f "tests/scaling/$file.sql"
          done

  production-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical production pages and database
        shell: bash
        run: |
          set -euo pipefail
          base='https://devfitportal.vercel.app'
          for path in / /login.html /api/config /api/health; do
            final_url="$(curl --fail --silent --show-error --location --max-time 20 --output /tmp/devfit-response --write-out '%{url_effective}' "$base$path")"
            case "$final_url" in
              "$base"*) ;;
              *) echo "Unexpected redirect: $path -> $final_url" >&2; exit 1 ;;
            esac
          done
          grep -q '"ok":true' /tmp/devfit-response
